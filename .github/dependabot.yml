version: 2

updates:
  # npm dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Roll up non-breaking updates into one PR per week — low noise, easy to merge.
      safe-updates:
        applies-to: version-updates
        update-types:
          - patch
          - minor
    ignore:
      # Skip prereleases; we upgrade majors deliberately.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # GitHub Actions versions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-safe-updates:
        applies-to: version-updates
        update-types:
          - patch
          - minor
