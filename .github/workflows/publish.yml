name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type (use "none" to publish current version as-is)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - none

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm test

      - run: npm run build

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        if: ${{ inputs.version_bump != 'none' }}
        run: npm version ${{ inputs.version_bump }}

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push version commit and tag
        if: ${{ inputs.version_bump != 'none' }}
        run: git push && git push --tags

      - name: Upgrade beecork on cloud server
        continue-on-error: true
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.CLOUD_SSH_KEY }}

      - name: Run cloud upgrade
        continue-on-error: true
        run: |
          ssh-keyscan -H 167.235.142.11 >> ~/.ssh/known_hosts
          VERSION=$(node -p "require('./package.json').version")
          echo "Waiting 30s for npm CDN propagation..."
          sleep 30
          echo "Upgrading cloud server to beecork@${VERSION}..."
          ssh root@167.235.142.11 "npm install -g beecork@${VERSION} && for u in \$(ls /home/ | grep ^bee); do su - \$u -c 'XDG_RUNTIME_DIR=/run/user/\$(id -u) systemctl --user restart beecork' || true; done && echo 'All user daemons restarted'"
